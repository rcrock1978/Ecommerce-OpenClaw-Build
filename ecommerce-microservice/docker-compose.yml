# ═══════════════════════════════════════════════════════════════════════
# E-Commerce Microservice Platform — Local Development Compose
# ═══════════════════════════════════════════════════════════════════════
# Usage:  docker compose up -d
#         docker compose logs -f user-service

version: "3.9"

x-common-env: &common-env
  NODE_ENV: development
  JWT_SECRET: local-dev-jwt-secret-change-in-prod
  JWT_REFRESH_SECRET: local-dev-refresh-secret-change-in-prod

networks:
  ecommerce:
    driver: bridge

volumes:
  pg_data:
  mongo_data:
  redis_data:
  es_data:
  kafka_data:
  zk_data:

services:
  # ── Infrastructure ───────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: users
    ports: ["5432:5432"]
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks: [ecommerce]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7
    ports: ["27017:27017"]
    volumes:
      - mongo_data:/data/db
    networks: [ecommerce]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes:
      - redis_data:/data
    networks: [ecommerce]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zk_data:/var/lib/zookeeper/data
    networks: [ecommerce]

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    depends_on: [zookeeper]
    ports: ["9092:9092"]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks: [ecommerce]

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports: ["9200:9200"]
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks: [ecommerce]

  # ── API Gateway ──────────────────────────────────────────────────

  kong:
    image: kong:3.7
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /etc/kong/kong.yml
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_LOG_LEVEL: info
    volumes:
      - ./sample-code/api-gateway/kong.yml:/etc/kong/kong.yml:ro
    ports:
      - "8000:8000"   # Proxy
      - "8001:8001"   # Admin API
    networks: [ecommerce]
    depends_on: [redis]

  # ── Microservices ────────────────────────────────────────────────

  user-service:
    build: ./sample-code/user-service
    environment:
      <<: *common-env
      PORT: 3001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: users
      DB_USER: postgres
      DB_PASSWORD: postgres
    ports: ["3001:3001"]
    networks: [ecommerce]
    depends_on:
      postgres:
        condition: service_healthy

