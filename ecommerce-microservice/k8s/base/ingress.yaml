apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ecommerce-ingress
  namespace: ecommerce
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
  - host: api.ecommerce.local
    http:
      paths:
      - path: /api/v1/cart
        pathType: Prefix
        backend:
          service:
            name: cart-service-service
            port:
              number: 3006
      - path: /api/v1/orders
        pathType: Prefix
        backend:
          service:
            name: order-service-service
            port:
              number: 3004
      - path: /api/v1/inventory
        pathType: Prefix
        backend:
          service:
            name: inventory-service-service
            port:
              number: 3003
      - path: /api/v1/reviews
        pathType: Prefix
        backend:
          service:
            name: review-service-service
            port:
              number: 3009
      - path: /api/v1/shipping
        pathType: Prefix
        backend:
          service:
            name: shipping-service-service
            port:
              number: 3010
      - path: /api/v1/users
        pathType: Prefix
        backend:
          service:
            name: user-service-service
            port:
              number: 3001
      - path: /api/v1/products
        pathType: Prefix
        backend:
          service:
            name: product-service-service
            port:
              number: 3002